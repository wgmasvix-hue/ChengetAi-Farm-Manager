name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p android assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ChengetAi-Farm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ChengetAi-Farm-apk
          path: ChengetAi-Farm.apk

      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: ChengetAi Farm Android app (latest)
          prerelease: true
          files: ChengetAi-Farm.apk
          body: |
            Android app for ChengetAi Farm Manager.

            Download `ChengetAi-Farm.apk` below, open it on your Android phone,
            and allow installation from unknown sources when prompted.
            On first launch, enter your farm name (e.g. `greenacres`) or leave
            it empty for the main site.
